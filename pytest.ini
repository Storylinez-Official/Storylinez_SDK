[pytest]
# Pure unit tests against src/storylinez — no network or API keys required.
# Ad-hoc junk (notebooks, dumps) goes in tests/_scratch/ (gitignored).
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -q --strict-markers --disable-warnings
markers =
    unit: fast isolated unit tests (no network)
